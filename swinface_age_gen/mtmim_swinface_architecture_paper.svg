<svg width="1200" height="950" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="900" fill="#ffffff"/>
  
  <!-- Title -->
  <text x="600" y="30" font-family="Times New Roman, serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#000000">
    MTMIM-SwinFace Architecture
  </text>
  
  <!-- Input Image -->
  <rect x="50" y="60" width="80" height="80" fill="#f0f0f0" stroke="#000000" stroke-width="1.5" rx="2"/>
  <text x="90" y="110" font-family="Times New Roman, serif" font-size="11" text-anchor="middle" fill="#000000">Input Image</text>
  <text x="90" y="125" font-family="Times New Roman, serif" font-size="9" text-anchor="middle" fill="#666666">112×112×3</text>
  
  <!-- Swin Transformer Backbone -->
  <rect x="180" y="50" width="280" height="140" fill="#ffffff" stroke="#000000" stroke-width="1.5" rx="2"/>
  <text x="320" y="75" font-family="Times New Roman, serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#000000">
    Shared Backbone (Swin Transformer)
  </text>
  
  <!-- Backbone stages -->
  <rect x="200" y="85" width="240" height="18" fill="#f8f8f8" stroke="#000000" stroke-width="1" rx="1"/>
  <text x="320" y="97" font-family="Times New Roman, serif" font-size="9" text-anchor="middle" fill="#000000">Patch Partition + Linear Embedding</text>
  
  <rect x="200" y="108" width="240" height="18" fill="#f8f8f8" stroke="#000000" stroke-width="1" rx="1"/>
  <text x="320" y="120" font-family="Times New Roman, serif" font-size="9" text-anchor="middle" fill="#000000">Stage 1-4: Swin Blocks + Patch Merging</text>
  
  <!-- Backbone outputs -->
  <rect x="200" y="135" width="70" height="25" fill="#e8e8e8" stroke="#000000" stroke-width="1" rx="1"/>
  <text x="235" y="148" font-family="Times New Roman, serif" font-size="9" text-anchor="middle" fill="#000000">local_features</text>
  <text x="235" y="157" font-family="Times New Roman, serif" font-size="8" text-anchor="middle" fill="#666666">FM1+FM2+FM3</text>
  
  <rect x="280" y="135" width="70" height="25" fill="#e8e8e8" stroke="#000000" stroke-width="1" rx="1"/>
  <text x="315" y="148" font-family="Times New Roman, serif" font-size="9" text-anchor="middle" fill="#000000">global_features</text>
  <text x="315" y="157" font-family="Times New Roman, serif" font-size="8" text-anchor="middle" fill="#666666">FM4</text>
  
  <rect x="360" y="135" width="70" height="25" fill="#e8e8e8" stroke="#000000" stroke-width="1" rx="1"/>
  <text x="395" y="148" font-family="Times New Roman, serif" font-size="9" text-anchor="middle" fill="#000000">embedding</text>
  <text x="395" y="157" font-family="Times New Roman, serif" font-size="8" text-anchor="middle" fill="#666666">512-dim</text>
  
  <!-- Arrow from input to backbone -->
  <path d="M 130 100 L 180 100" stroke="#000000" stroke-width="1.5" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Face Analysis Subnet -->
  <rect x="50" y="220" width="280" height="280" fill="#ffffff" stroke="#000000" stroke-width="1.5" rx="2"/>
  <text x="190" y="240" font-family="Times New Roman, serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#000000">
    Face Analysis Subnet
  </text>
  
  <!-- Feature fusion -->
  <rect x="70" y="255" width="240" height="25" fill="#f5f5f5" stroke="#000000" stroke-width="1" rx="1"/>
  <text x="190" y="270" font-family="Times New Roman, serif" font-size="10" text-anchor="middle" fill="#000000">Feature Fusion: local_features ⊕ global_features</text>
  <text x="190" y="280" font-family="Times New Roman, serif" font-size="8" text-anchor="middle" fill="#666666">(2112 channels)</text>
  
  <!-- FAM -->
  <rect x="70" y="290" width="240" height="25" fill="#f5f5f5" stroke="#000000" stroke-width="1" rx="1"/>
  <text x="190" y="305" font-family="Times New Roman, serif" font-size="10" text-anchor="middle" fill="#000000">FAM (Feature Attention Module)</text>
  <text x="190" y="315" font-family="Times New Roman, serif" font-size="8" text-anchor="middle" fill="#666666">Multi-level feature processing</text>
  
  <!-- TSS -->
  <rect x="70" y="325" width="240" height="25" fill="#f5f5f5" stroke="#000000" stroke-width="1" rx="1"/>
  <text x="190" y="340" font-family="Times New Roman, serif" font-size="10" text-anchor="middle" fill="#000000">TSS (Task Specific Subnets)</text>
  <text x="190" y="350" font-family="Times New Roman, serif" font-size="8" text-anchor="middle" fill="#666666">11 task-specific branches</text>
  
  <!-- OM -->
  <rect x="70" y="360" width="240" height="25" fill="#f5f5f5" stroke="#000000" stroke-width="1" rx="1"/>
  <text x="190" y="375" font-family="Times New Roman, serif" font-size="10" text-anchor="middle" fill="#000000">OM (Output Module)</text>
  <text x="190" y="385" font-family="Times New Roman, serif" font-size="8" text-anchor="middle" fill="#666666">43 task outputs</text>
  
  <!-- Analysis outputs -->
  <rect x="70" y="400" width="75" height="35" fill="#e0e0e0" stroke="#000000" stroke-width="1" rx="1"/>
  <text x="107.5" y="416" font-family="Times New Roman, serif" font-size="10" text-anchor="middle" fill="#000000">Gender</text>
  <text x="107.5" y="428" font-family="Times New Roman, serif" font-size="8" text-anchor="middle" fill="#666666">outputs[5]</text>
  
  <rect x="155" y="400" width="75" height="35" fill="#e0e0e0" stroke="#000000" stroke-width="1" rx="1"/>
  <text x="192.5" y="416" font-family="Times New Roman, serif" font-size="10" text-anchor="middle" fill="#000000">CelebA</text>
  <text x="192.5" y="428" font-family="Times New Roman, serif" font-size="8" text-anchor="middle" fill="#666666">outputs[1:41]</text>
  
  <rect x="240" y="400" width="70" height="35" fill="#e0e0e0" stroke="#000000" stroke-width="1" rx="1"/>
  <text x="275" y="416" font-family="Times New Roman, serif" font-size="10" text-anchor="middle" fill="#000000">Expression</text>
  <text x="275" y="428" font-family="Times New Roman, serif" font-size="8" text-anchor="middle" fill="#666666">outputs[41]</text>
  
  <!-- Arrows to Face Analysis -->
  <path d="M 235 190 L 190 255" stroke="#000000" stroke-width="1.5" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 315 190 L 190 255" stroke="#000000" stroke-width="1.5" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- MT-MIM Branch -->
  <rect x="500" y="220" width="350" height="280" fill="#ffffff" stroke="#000000" stroke-width="1.5" rx="2"/>
  <text x="675" y="240" font-family="Times New Roman, serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#000000">
    MT-MIM Branch
  </text>
  
  <!-- Age Extractor -->
  <rect x="520" y="260" width="150" height="45" fill="#f5f5f5" stroke="#000000" stroke-width="1" rx="1"/>
  <text x="595" y="278" font-family="Times New Roman, serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#000000">Age Extractor φ(·)</text>
  <text x="595" y="290" font-family="Times New Roman, serif" font-size="9" text-anchor="middle" fill="#000000">embedding → x_age</text>
  <text x="595" y="300" font-family="Times New Roman, serif" font-size="8" text-anchor="middle" fill="#666666">512 → 256 → 512</text>
  
  <!-- Identity computation -->
  <rect x="690" y="260" width="140" height="45" fill="#f5f5f5" stroke="#000000" stroke-width="1" rx="1"/>
  <text x="760" y="278" font-family="Times New Roman, serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#000000">Identity Feature</text>
  <text x="760" y="290" font-family="Times New Roman, serif" font-size="9" text-anchor="middle" fill="#000000">x_id = embedding - x_age</text>
  <text x="760" y="300" font-family="Times New Roman, serif" font-size="8" text-anchor="middle" fill="#666666">Residual connection</text>
  
  <!-- Arrow from embedding to Age Extractor -->
  <path d="M 395 190 L 595 260" stroke="#000000" stroke-width="1.5" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Arrow from Age Extractor to Identity -->
  <path d="M 670 282.5 L 690 282.5" stroke="#000000" stroke-width="1.5" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Arrow from embedding to Identity (for subtraction) -->
  <path d="M 395 190 L 760 260" stroke="#000000" stroke-width="1.5" stroke-dasharray="3,3" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- MT-MIM Age Head -->
  <rect x="520" y="320" width="150" height="40" fill="#e8e8e8" stroke="#000000" stroke-width="1" rx="1"/>
  <text x="595" y="337" font-family="Times New Roman, serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#000000">MT-MIM Age Head</text>
  <text x="595" y="350" font-family="Times New Roman, serif" font-size="9" text-anchor="middle" fill="#000000">x_age → age_pred</text>
  <text x="595" y="360" font-family="Times New Roman, serif" font-size="8" text-anchor="middle" fill="#666666">512 → 256 → 1</text>
  
  <!-- MT-MIM ID Head -->
  <rect x="690" y="320" width="140" height="40" fill="#e8e8e8" stroke="#000000" stroke-width="1" rx="1"/>
  <text x="760" y="337" font-family="Times New Roman, serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#000000">MT-MIM ID Head</text>
  <text x="760" y="350" font-family="Times New Roman, serif" font-size="9" text-anchor="middle" fill="#000000">x_id → id_embedding</text>
  <text x="760" y="360" font-family="Times New Roman, serif" font-size="8" text-anchor="middle" fill="#666666">512 → 512 → 512</text>
  
  <!-- Arrows from Age Extractor and Identity to heads -->
  <path d="M 595 305 L 595 320" stroke="#000000" stroke-width="1.5" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 760 305 L 760 320" stroke="#000000" stroke-width="1.5" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Outputs -->
  <rect x="520" y="375" width="150" height="35" fill="#d0d0d0" stroke="#000000" stroke-width="1" rx="1"/>
  <text x="595" y="393" font-family="Times New Roman, serif" font-size="10" text-anchor="middle" fill="#000000">age_pred</text>
  <text x="595" y="405" font-family="Times New Roman, serif" font-size="8" text-anchor="middle" fill="#666666">(1-dim)</text>
  
  <rect x="690" y="375" width="140" height="35" fill="#d0d0d0" stroke="#000000" stroke-width="1" rx="1"/>
  <text x="760" y="393" font-family="Times New Roman, serif" font-size="10" text-anchor="middle" fill="#000000">id_embedding</text>
  <text x="760" y="405" font-family="Times New Roman, serif" font-size="8" text-anchor="middle" fill="#666666">(512-dim)</text>
  
  <!-- Arrows to outputs -->
  <path d="M 595 360 L 595 375" stroke="#000000" stroke-width="1.5" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 760 360 L 760 375" stroke="#000000" stroke-width="1.5" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Age Loss -->
  <rect x="520" y="425" width="150" height="30" fill="#f5f5f5" stroke="#000000" stroke-width="1" rx="1"/>
  <text x="595" y="440" font-family="Times New Roman, serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#000000">Age Loss</text>
  <text x="595" y="452" font-family="Times New Roman, serif" font-size="8" text-anchor="middle" fill="#666666">L_age(age_pred, age_label)</text>
  
  <!-- Recognition Loss -->
  <rect x="690" y="425" width="140" height="30" fill="#f5f5f5" stroke="#000000" stroke-width="1" rx="1"/>
  <text x="760" y="440" font-family="Times New Roman, serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#000000">Recognition Loss</text>
  <text x="760" y="452" font-family="Times New Roman, serif" font-size="8" text-anchor="middle" fill="#666666">L_rec(id_embedding, id_label)</text>
  
  <!-- Arrows from outputs to losses -->
  <path d="M 595 410 L 595 425" stroke="#000000" stroke-width="1.5" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 760 410 L 760 425" stroke="#000000" stroke-width="1.5" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- MI Loss -->
  <rect x="920" y="280" width="240" height="80" fill="#ffffff" stroke="#000000" stroke-width="1.5" rx="2"/>
  <text x="1040" y="300" font-family="Times New Roman, serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#000000">
    MI Loss
  </text>
  
  <rect x="940" y="310" width="100" height="25" fill="#f5f5f5" stroke="#000000" stroke-width="1" rx="1"/>
  <text x="990" y="323" font-family="Times New Roman, serif" font-size="10" text-anchor="middle" fill="#000000">x_id</text>
  <text x="990" y="332" font-family="Times New Roman, serif" font-size="8" text-anchor="middle" fill="#666666">(Identity)</text>
  
  <text x="1040" y="325" font-family="Times New Roman, serif" font-size="14" text-anchor="middle" fill="#000000">⟂</text>
  
  <rect x="1000" y="310" width="100" height="25" fill="#f5f5f5" stroke="#000000" stroke-width="1" rx="1"/>
  <text x="1050" y="323" font-family="Times New Roman, serif" font-size="10" text-anchor="middle" fill="#000000">x_age</text>
  <text x="1050" y="332" font-family="Times New Roman, serif" font-size="8" text-anchor="middle" fill="#666666">(Age)</text>
  
  <text x="1040" y="350" font-family="Times New Roman, serif" font-size="9" text-anchor="middle" fill="#000000">Minimize I(x_id; x_age)</text>
  <text x="1040" y="365" font-family="Times New Roman, serif" font-size="8" text-anchor="middle" fill="#666666">Using InfoNCE loss</text>
  
  <!-- Arrows to MI Loss -->
  <path d="M 760 392.5 L 990 322.5" stroke="#000000" stroke-width="1.5" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 595 392.5 L 1050 322.5" stroke="#000000" stroke-width="1.5" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Loss computation -->
  <rect x="500" y="480" width="350" height="120" fill="#ffffff" stroke="#000000" stroke-width="1.5" rx="2"/>
  <text x="675" y="500" font-family="Times New Roman, serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#000000">
    Total Loss
  </text>
  
  <rect x="520" y="510" width="310" height="18" fill="#f5f5f5" stroke="#000000" stroke-width="1" rx="1"/>
  <text x="675" y="522" font-family="Times New Roman, serif" font-size="9" text-anchor="middle" fill="#000000">L = w_rec·L_rec + w_age·L_age + w_gender·L_gender + w_celebA·L_celebA + w_expr·L_expression + w_MI·L_MI</text>
  
  <rect x="520" y="535" width="60" height="20" fill="#e8e8e8" stroke="#000000" stroke-width="1" rx="1"/>
  <text x="550" y="548" font-family="Times New Roman, serif" font-size="9" text-anchor="middle" fill="#000000">Recognition</text>
  
  <rect x="590" y="535" width="60" height="20" fill="#e8e8e8" stroke="#000000" stroke-width="1" rx="1"/>
  <text x="620" y="548" font-family="Times New Roman, serif" font-size="9" text-anchor="middle" fill="#000000">Age</text>
  
  <rect x="660" y="535" width="60" height="20" fill="#e8e8e8" stroke="#000000" stroke-width="1" rx="1"/>
  <text x="690" y="548" font-family="Times New Roman, serif" font-size="9" text-anchor="middle" fill="#000000">Gender</text>
  
  <rect x="730" y="535" width="60" height="20" fill="#e8e8e8" stroke="#000000" stroke-width="1" rx="1"/>
  <text x="760" y="548" font-family="Times New Roman, serif" font-size="9" text-anchor="middle" fill="#000000">CelebA</text>
  
  <rect x="800" y="535" width="60" height="20" fill="#e8e8e8" stroke="#000000" stroke-width="1" rx="1"/>
  <text x="830" y="548" font-family="Times New Roman, serif" font-size="9" text-anchor="middle" fill="#000000">Expression</text>
  
  <rect x="520" y="560" width="60" height="20" fill="#e8e8e8" stroke="#000000" stroke-width="1" rx="1"/>
  <text x="550" y="573" font-family="Times New Roman, serif" font-size="9" text-anchor="middle" fill="#000000">MI Loss</text>
  
  <!-- Arrows to Loss -->
  <path d="M 760 455 L 620 535" stroke="#000000" stroke-width="1.5" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 595 455 L 620 535" stroke="#000000" stroke-width="1.5" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 107.5 435 L 690 535" stroke="#000000" stroke-width="1.5" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 192.5 435 L 760 535" stroke="#000000" stroke-width="1.5" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 275 435 L 830 535" stroke="#000000" stroke-width="1.5" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 1040 360 L 550 560" stroke="#000000" stroke-width="1.5" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Mathematical notation -->
  <rect x="920" y="480" width="240" height="120" fill="#ffffff" stroke="#000000" stroke-width="1.5" rx="2"/>
  <text x="1040" y="500" font-family="Times New Roman, serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#000000">
    Mathematical Formulation
  </text>
  
  <text x="940" y="520" font-family="Times New Roman, serif" font-size="9" fill="#000000">x_age = φ(embedding)</text>
  <text x="940" y="535" font-family="Times New Roman, serif" font-size="9" fill="#000000">x_id = embedding - x_age</text>
  <text x="940" y="550" font-family="Times New Roman, serif" font-size="9" fill="#000000">L_age = AgeLoss(age_pred, age_label)</text>
  <text x="940" y="565" font-family="Times New Roman, serif" font-size="9" fill="#000000">L_rec = RecognitionLoss(id_embedding, id_label)</text>
  <text x="940" y="580" font-family="Times New Roman, serif" font-size="9" fill="#000000">L_MI = -log(σ(sim(x_id, x_age_shuffled)</text>
  <text x="940" y="595" font-family="Times New Roman, serif" font-size="9" fill="#000000">                - sim(x_id, x_age)))</text>
  
  <!-- Arrow markers -->
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 0, 8 4, 0 8" fill="#000000"/>
    </marker>
  </defs>
  
  <!-- Feature dimensions annotation -->
  <text x="50" y="900" font-family="Times New Roman, serif" font-size="9" fill="#666666">
    Note: FM1 (28×28×192), FM2 (14×14×384), FM3 (7×7×768), FM4 (7×7×768). 
  </text>
  <text x="50" y="915" font-family="Times New Roman, serif" font-size="9" fill="#666666">
    Training stages: Main training (train.py) uses Recognition + Age + MI losses. Rest tasks training (train_rest_mtmim.py) uses Gender + CelebA + Expression + MI losses.
  </text>
  
</svg>

