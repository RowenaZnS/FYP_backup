<svg width="1400" height="1000" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1400" height="1000" fill="#f5f5f5"/>
  
  <!-- Title -->
  <text x="700" y="30" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#333">
    MTMIM-SwinFace Architecture
  </text>
  
  <!-- Input Image -->
  <rect x="50" y="80" width="100" height="100" fill="#e3f2fd" stroke="#1976d2" stroke-width="2" rx="5"/>
  <text x="100" y="145" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1976d2">Input</text>
  <text x="100" y="160" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666">112×112×3</text>
  
  <!-- Swin Transformer Backbone -->
  <rect x="200" y="60" width="300" height="160" fill="#fff3e0" stroke="#f57c00" stroke-width="2" rx="5"/>
  <text x="350" y="85" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#e65100">
    Shared Backbone (Swin Transformer)
  </text>
  
  <!-- Backbone stages -->
  <rect x="220" y="100" width="260" height="20" fill="#ffe0b2" stroke="#f57c00" stroke-width="1" rx="3"/>
  <text x="350" y="113" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#333">Patch Partition + Linear Embedding</text>
  
  <rect x="220" y="125" width="260" height="20" fill="#ffe0b2" stroke="#f57c00" stroke-width="1" rx="3"/>
  <text x="350" y="138" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#333">Stage 1-4 (Swin Blocks + Patch Merging)</text>
  
  <!-- Backbone outputs -->
  <rect x="220" y="150" width="80" height="30" fill="#8d6e63" stroke="#5d4037" stroke-width="1" rx="3"/>
  <text x="260" y="165" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#fff">local_features</text>
  <text x="260" y="175" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#fff">(FM1+FM2+FM3)</text>
  
  <rect x="310" y="150" width="80" height="30" fill="#ffa726" stroke="#f57c00" stroke-width="1" rx="3"/>
  <text x="350" y="165" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#fff">global_features</text>
  <text x="350" y="175" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#fff">(FM4: 7×7×768)</text>
  
  <rect x="400" y="150" width="80" height="30" fill="#42a5f5" stroke="#1976d2" stroke-width="1" rx="3"/>
  <text x="440" y="165" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#fff">embedding</text>
  <text x="440" y="175" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#fff">(512-dim)</text>
  
  <!-- Arrow from input to backbone -->
  <path d="M 150 130 L 200 130" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Arrows from backbone to outputs -->
  <path d="M 260 165 L 260 250" stroke="#8d6e63" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 350 165 L 350 250" stroke="#ffa726" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 440 165 L 440 250" stroke="#42a5f5" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Face Analysis Subnet (Left side) -->
  <rect x="50" y="250" width="280" height="320" fill="#e8f5e9" stroke="#388e3c" stroke-width="2" rx="5"/>
  <text x="190" y="275" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#2e7d32">
    Face Analysis Subnet
  </text>
  
  <!-- Feature fusion -->
  <rect x="70" y="290" width="240" height="30" fill="#c8e6c9" stroke="#388e3c" stroke-width="1" rx="3"/>
  <text x="190" y="305" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#333">Feature Fusion: local_features + global_features</text>
  <text x="190" y="315" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#666">(2112 channels: 192+384+768+768)</text>
  
  <!-- FAM -->
  <rect x="70" y="330" width="240" height="30" fill="#a5d6a7" stroke="#388e3c" stroke-width="1" rx="3"/>
  <text x="190" y="345" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#333">FAM (Feature Attention Module)</text>
  <text x="190" y="355" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#666">Split Mode: [192, 384, 768, 768] → [47, 93, 186, 186]</text>
  
  <!-- TSS -->
  <rect x="70" y="370" width="240" height="30" fill="#81c784" stroke="#388e3c" stroke-width="1" rx="3"/>
  <text x="190" y="385" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#333">TSS (Task Specific Subnets)</text>
  <text x="190" y="395" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#666">11 branches for different tasks</text>
  
  <!-- OM -->
  <rect x="70" y="410" width="240" height="30" fill="#66bb6a" stroke="#388e3c" stroke-width="1" rx="3"/>
  <text x="190" y="425" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#333">OM (Output Module)</text>
  <text x="190" y="435" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#666">43 task outputs</text>
  
  <!-- Analysis outputs -->
  <rect x="70" y="450" width="110" height="40" fill="#4caf50" stroke="#2e7d32" stroke-width="1" rx="3"/>
  <text x="125" y="465" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#fff">Gender</text>
  <text x="125" y="480" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#fff">(outputs[5])</text>
  
  <rect x="190" y="450" width="110" height="40" fill="#4caf50" stroke="#2e7d32" stroke-width="1" rx="3"/>
  <text x="245" y="465" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#fff">CelebA</text>
  <text x="245" y="480" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#fff">(outputs[1:41])</text>
  
  <rect x="130" y="500" width="110" height="40" fill="#4caf50" stroke="#2e7d32" stroke-width="1" rx="3"/>
  <text x="185" y="515" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#fff">Expression</text>
  <text x="185" y="530" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#fff">(outputs[41])</text>
  
  <!-- Arrows to Face Analysis -->
  <path d="M 260 250 L 190 290" stroke="#388e3c" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 350 250 L 190 290" stroke="#388e3c" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- MT-MIM Branch (Right side) -->
  <rect x="550" y="250" width="400" height="320" fill="#e3f2fd" stroke="#1976d2" stroke-width="2" rx="5"/>
  <text x="750" y="275" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#1565c0">
    MT-MIM Branch
  </text>
  
  <!-- Age Extractor -->
  <rect x="570" y="290" width="180" height="50" fill="#90caf9" stroke="#1976d2" stroke-width="1" rx="3"/>
  <text x="660" y="310" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#1565c0">Age Extractor</text>
  <text x="660" y="325" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#333">φ(·): embedding → x_age</text>
  <text x="660" y="335" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#666">512 → 256 → 512</text>
  
  <!-- Identity computation -->
  <rect x="770" y="290" width="160" height="50" fill="#64b5f6" stroke="#1976d2" stroke-width="1" rx="3"/>
  <text x="850" y="310" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#1565c0">Identity</text>
  <text x="850" y="325" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#333">x_id = embedding - x_age</text>
  <text x="850" y="335" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#666">Residual connection</text>
  
  <!-- Arrow from embedding to Age Extractor -->
  <path d="M 440 250 L 660 290" stroke="#1976d2" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Arrow from Age Extractor to Identity -->
  <path d="M 750 315 L 770 315" stroke="#1976d2" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Arrow from embedding to Identity (for subtraction) -->
  <path d="M 440 250 L 850 290" stroke="#1976d2" stroke-width="2" stroke-dasharray="5,5" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- MT-MIM Age Head -->
  <rect x="570" y="360" width="180" height="50" fill="#42a5f5" stroke="#1976d2" stroke-width="1" rx="3"/>
  <text x="660" y="380" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#fff">MT-MIM Age Head</text>
  <text x="660" y="395" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#fff">x_age → age_pred</text>
  <text x="660" y="405" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#fff">512 → 256 → 1</text>
  
  <!-- MT-MIM ID Head -->
  <rect x="770" y="360" width="160" height="50" fill="#42a5f5" stroke="#1976d2" stroke-width="1" rx="3"/>
  <text x="850" y="380" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#fff">MT-MIM ID Head</text>
  <text x="850" y="395" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#fff">x_id → id_embedding</text>
  <text x="850" y="405" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#fff">512 → 512 → 512</text>
  
  <!-- Arrows from Age Extractor and Identity to heads -->
  <path d="M 660 340 L 660 360" stroke="#1976d2" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 850 340 L 850 360" stroke="#1976d2" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Outputs -->
  <rect x="570" y="430" width="180" height="40" fill="#2196f3" stroke="#1565c0" stroke-width="1" rx="3"/>
  <text x="660" y="450" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#fff">age_pred</text>
  <text x="660" y="465" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#fff">(Not used in training)</text>
  
  <rect x="770" y="430" width="160" height="40" fill="#2196f3" stroke="#1565c0" stroke-width="1" rx="3"/>
  <text x="850" y="450" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#fff">id_embedding</text>
  <text x="850" y="465" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#fff">(512-dim)</text>
  
  <!-- Arrows to outputs -->
  <path d="M 660 410 L 660 430" stroke="#1976d2" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 850 410 L 850 430" stroke="#1976d2" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- MI Loss -->
  <rect x="1050" y="350" width="280" height="100" fill="#fff3e0" stroke="#f57c00" stroke-width="2" rx="5"/>
  <text x="1190" y="375" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#e65100">
    MI Loss (Mutual Information Minimization)
  </text>
  
  <rect x="1070" y="385" width="120" height="30" fill="#ffe0b2" stroke="#f57c00" stroke-width="1" rx="3"/>
  <text x="1130" y="400" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#333">x_id</text>
  <text x="1130" y="410" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#666">(Identity)</text>
  
  <text x="1190" y="405" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#e65100">⟂</text>
  
  <rect x="1210" y="385" width="120" height="30" fill="#ffe0b2" stroke="#f57c00" stroke-width="1" rx="3"/>
  <text x="1270" y="400" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#333">x_age</text>
  <text x="1270" y="410" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#666">(Age)</text>
  
  <text x="1190" y="440" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666">Minimize I(x_id; x_age)</text>
  <text x="1190" y="455" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#666">Using InfoNCE loss</text>
  
  <!-- Arrows to MI Loss -->
  <path d="M 850 450 L 1130 400" stroke="#f57c00" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 660 450 L 1270 400" stroke="#f57c00" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Loss computation -->
  <rect x="550" y="600" width="400" height="120" fill="#fce4ec" stroke="#c2185b" stroke-width="2" rx="5"/>
  <text x="750" y="625" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#880e4f">
    Total Loss
  </text>
  
  <rect x="570" y="640" width="360" height="20" fill="#f8bbd0" stroke="#c2185b" stroke-width="1" rx="3"/>
  <text x="750" y="653" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#333">L = w₁·L_gender + w₂·L_celebA + w₃·L_expression + w₄·L_MI</text>
  
  <rect x="570" y="665" width="110" height="25" fill="#f48fb1" stroke="#c2185b" stroke-width="1" rx="3"/>
  <text x="625" y="680" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#fff">Gender Loss</text>
  
  <rect x="690" y="665" width="110" height="25" fill="#f48fb1" stroke="#c2185b" stroke-width="1" rx="3"/>
  <text x="745" y="680" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#fff">CelebA Loss</text>
  
  <rect x="810" y="665" width="110" height="25" fill="#f48fb1" stroke="#c2185b" stroke-width="1" rx="3"/>
  <text x="865" y="680" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#fff">Expression Loss</text>
  
  <rect x="750" y="695" width="100" height="20" fill="#ec407a" stroke="#c2185b" stroke-width="1" rx="3"/>
  <text x="800" y="708" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#fff">MI Loss</text>
  
  <!-- Arrows to Loss -->
  <path d="M 125 540 L 625 665" stroke="#c2185b" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 245 540 L 745 665" stroke="#c2185b" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 185 540 L 865 665" stroke="#c2185b" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 1190 450 L 800 695" stroke="#c2185b" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Note about Face Analysis -->
  <rect x="50" y="580" width="280" height="80" fill="#fff9c4" stroke="#f9a825" stroke-width="1" rx="3"/>
  <text x="190" y="600" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#f57f17">Note:</text>
  <text x="190" y="615" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#333">Face Analysis uses original</text>
  <text x="190" y="630" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#333">features (not x_id/x_age)</text>
  <text x="190" y="645" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#666">but benefits from backbone</text>
  <text x="190" y="660" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#666">optimization via MI Loss</text>
  
  <!-- Arrow markers -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#333"/>
    </marker>
  </defs>
  
  <!-- Legend -->
  <rect x="1050" y="580" width="280" height="120" fill="#ffffff" stroke="#666" stroke-width="1" rx="3"/>
  <text x="1190" y="600" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#333">Legend</text>
  
  <rect x="1070" y="610" width="20" height="15" fill="#fff3e0" stroke="#f57c00" stroke-width="1"/>
  <text x="1100" y="621" font-family="Arial, sans-serif" font-size="9" fill="#333">Backbone</text>
  
  <rect x="1070" y="630" width="20" height="15" fill="#e8f5e9" stroke="#388e3c" stroke-width="1"/>
  <text x="1100" y="641" font-family="Arial, sans-serif" font-size="9" fill="#333">Face Analysis</text>
  
  <rect x="1070" y="650" width="20" height="15" fill="#e3f2fd" stroke="#1976d2" stroke-width="1"/>
  <text x="1100" y="661" font-family="Arial, sans-serif" font-size="9" fill="#333">MT-MIM</text>
  
  <rect x="1070" y="670" width="20" height="15" fill="#fff3e0" stroke="#f57c00" stroke-width="1"/>
  <text x="1100" y="681" font-family="Arial, sans-serif" font-size="9" fill="#333">MI Loss</text>
  
  <rect x="1210" y="610" width="20" height="15" fill="#fce4ec" stroke="#c2185b" stroke-width="1"/>
  <text x="1240" y="621" font-family="Arial, sans-serif" font-size="9" fill="#333">Loss</text>
  
  <rect x="1210" y="630" width="20" height="15" fill="#fff9c4" stroke="#f9a825" stroke-width="1"/>
  <text x="1240" y="641" font-family="Arial, sans-serif" font-size="9" fill="#333">Note</text>
  
</svg>

